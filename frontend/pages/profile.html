<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil — SENAI Connect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page-wrap">
    <div class="grid-layout">
      <div>
        <div class="card" id="profile-header">
          <div class="spinner"></div>
        </div>

        <div class="card hidden" id="edit-bio-card">
          <h3 class="mt-0">Editar bio</h3>
          <div id="bio-alert"></div>
          <form id="bio-form">
            <div class="form-group">
              <textarea id="bio-input" maxlength="250" placeholder="Fale um pouco sobre você..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Salvar bio</button>
          </form>
        </div>

        <div class="card hidden" id="avatar-card">
          <h3 class="mt-0">Foto de perfil</h3>
          <div id="avatar-alert"></div>
          <input type="file" id="avatar-input" accept="image/png, image/jpeg, image/webp">
          <div class="form-hint">JPEG, PNG ou WebP. Máximo 3MB.</div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="card">
          <div class="tabs">
            <button class="tab-btn active" data-tab="followers">Seguidores</button>
            <button class="tab-btn" data-tab="following">Seguindo</button>
          </div>
          <div id="followers-list"><div class="spinner"></div></div>
          <div id="following-list" class="hidden"></div>
        </div>
      </aside>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
