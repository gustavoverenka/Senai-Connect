<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Perfil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">SENAI Connect</div>
            <div class="nav-links">
                <a href="feed.html">Feed</a>
                <a href="profile.html">Perfil</a>
                <a href="search.html">Buscar</a>
                <a href="inbox.html">Mensagens</a>
                <button onclick="logout()">Sair da Conta</button>
            </div>
        </div>
    </nav>

    <main class="profile-container">
        <div class="profile-card">
            <img id="profileAvatar" class="profile-avatar" alt="Foto de perfil">
            <h2 id="profileName">Carregando...</h2>
            <p id="profileUsername" style="color:var(--text-light);">@...</p>
            <p id="profileBio">Sem bio por enquanto.</p>
        </div>

        <div class="profile-edit">
            <h3>Editar Perfil</h3>
            <div class="form-group">
                <label>Bio (máx. 250 caracteres)</label>
                <textarea id="bioInput" rows="2" maxlength="250" placeholder="Conte algo sobre você..."></textarea>
            </div>
            <div class="form-group">
                <label>Foto de Perfil</label>
                <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp">
            </div>
            <div class="profile-actions">
                <button class="btn-primary" onclick="updateBio()">Salvar Bio</button>
                <button class="btn-secondary" onclick="uploadAvatar()">Enviar Foto</button>
            </div>
        </div>

        <div class="connections">
            <button class="btn-secondary" onclick="loadConnections('followers')">Ver Seguidores</button>
            <button class="btn-secondary" onclick="loadConnections('following')">Ver Seguindo</button>
            <div id="connectionList"><p style="color:var(--text-light);">Clique em um botão para ver suas conexões.</p></div>
        </div>
    </main>

</body>
</html>
