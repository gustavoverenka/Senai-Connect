<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Perfil do Membro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">
                <span class="senai-badge">SENAI</span>
                <span>Connect</span>
            </div>
            <div class="nav-links">
                <a href="feed.html">Feed</a>
                <a href="opportunities.html">Vagas e Mentoria</a>
                <a href="search.html">Explorar</a>
                <a href="inbox.html">Mensagens</a>
                <a href="profile.html">Meu Perfil</a>
                <a href="admin.html" id="adminNav" class="is-hidden">Moderacao</a>
                <button id="btnLogout" class="btn-logout">Sair</button>
            </div>
        </div>
    </nav>

    <main class="profile-container">
        <!-- Cartão de Visualização de Perfil -->
        <article class="card profile-card">
            <img id="userAvatar" class="profile-avatar" src="" alt="Foto de perfil">
            <h2 id="userName" class="profile-name">Carregando...</h2>
            <div id="userBadge" class="profile-badge-container"></div>
            <p id="userUsername" class="profile-username">@...</p>
            
            <div id="userExtraInfo" class="profile-extra-info"></div>

            <p id="userBio" class="profile-bio">Sem biografia informada.</p>
            
            <div class="user-interaction-actions">
                <button id="followBtn" class="btn-primary is-hidden">Seguir</button>
                <button id="msgBtn" class="btn-secondary is-hidden">Enviar Mensagem</button>
            </div>
        </article>

        <!-- Conexões do Usuário -->
        <section class="card connections-card">
            <div class="connections-toggle">
                <button id="btnUserFollowers" class="btn-secondary active">Seguidores</button>
                <button id="btnUserFollowing" class="btn-secondary">Seguindo</button>
            </div>
            
            <div id="connectionList" class="connections-list" aria-live="polite">
                <p class="state-message">Carregando conexoes...</p>
            </div>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/user.js"></script>
</body>
</html>
