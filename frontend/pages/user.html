<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Perfil do Usuário</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">SENAI Connect</div>
            <div class="nav-links">
                <a href="feed.html">Feed</a>
                <a href="profile.html">Perfil</a>
                <a href="search.html">Buscar</a>
                <a href="inbox.html">Mensagens</a>
                <button onclick="logout()">Sair da Conta</button>
            </div>
        </div>
    </nav>

    <main class="profile-container">
        <div class="profile-card">
            <img id="userAvatar" class="profile-avatar" alt="Foto de perfil">
            <h2 id="userName">Carregando...</h2>
            <p id="userUsername" style="color:var(--text-light);">@...</p>
            <p id="userBio">Sem bio por enquanto.</p>
            
            <div style="margin-top: 15px; display: flex; gap: 10px; justify-content: center;">
                <button id="followBtn" class="btn-primary" onclick="toggleFollowUser()" style="display:none; width: auto; padding: 10px 20px;">Seguir</button>
                <button id="msgBtn" class="btn-secondary" onclick="window.location.href='chat.html?id=' + userId" style="display:none; width: auto; padding: 10px 20px;">Mandar Mensagem</button>
            </div>
        </div>

        <div class="connections">
            <button class="btn-secondary" onclick="loadConnections('followers')">Ver Seguidores</button>
            <button class="btn-secondary" onclick="loadConnections('following')">Ver Seguindo</button>
            <div id="connectionList"><p style="color:var(--text-light);">Clique em um botão para ver as conexões.</p></div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/user.js"></script>
</body>
</html>
