<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oportunidades — SENAI Connect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page-wrap">
    <div class="grid-layout">
      <div>
        <div class="card">
          <h2 class="mt-0">Oportunidades</h2>
          <div class="filters-bar">
            <select id="filter-type">
              <option value="">Todos os tipos</option>
              <option value="estagio">Estágio</option>
              <option value="emprego">Emprego</option>
              <option value="mentoria">Mentoria</option>
              <option value="projeto">Projeto</option>
            </select>
            <select id="filter-workplace">
              <option value="">Qualquer modalidade</option>
              <option value="remoto">Remoto</option>
              <option value="hibrido">Híbrido</option>
              <option value="presencial">Presencial</option>
            </select>
            <button class="btn btn-secondary" id="filter-btn">Filtrar</button>
          </div>
        </div>

        <div id="opportunities-list"><div class="spinner"></div></div>
      </div>

      <aside class="sidebar">
        <div class="card" id="create-card">
          <h3 class="mt-0">Publicar oportunidade</h3>
          <div id="create-alert"></div>
          <form id="create-form">
            <div class="form-group">
              <label for="opp-title">Título</label>
              <input type="text" id="opp-title" required placeholder="Ex: Estágio em Desenvolvimento">
            </div>
            <div class="form-group">
              <label for="opp-type">Tipo</label>
              <select id="opp-type" required>
                <option value="estagio">Estágio</option>
                <option value="emprego">Emprego</option>
                <option value="mentoria">Mentoria</option>
                <option value="projeto">Projeto</option>
              </select>
            </div>
            <div class="form-group">
              <label for="opp-company">Empresa</label>
              <input type="text" id="opp-company" placeholder="Nome da empresa (opcional)">
            </div>
            <div class="form-group">
              <label for="opp-workplace">Modalidade</label>
              <select id="opp-workplace">
                <option value="presencial">Presencial</option>
                <option value="remoto">Remoto</option>
                <option value="hibrido">Híbrido</option>
              </select>
            </div>
            <div class="form-group">
              <label for="opp-location">Localização</label>
              <input type="text" id="opp-location" placeholder="Ex: Blumenau - SC">
            </div>
            <div class="form-group">
              <label for="opp-description">Descrição</label>
              <textarea id="opp-description" required placeholder="Descreva a oportunidade..."></textarea>
            </div>
            <div class="form-group">
              <label for="opp-requirements">Requisitos</label>
              <textarea id="opp-requirements" placeholder="Requisitos desejados (opcional)"></textarea>
            </div>
            <div class="form-group">
              <label for="opp-contact">E-mail, telefone ou link para candidatura</label>
              <input type="text" id="opp-contact" required placeholder="Como as pessoas devem se candidatar?">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Publicar</button>
          </form>
        </div>
      </aside>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/opportunities.js"></script>
</body>
</html>
