<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/chat.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">
                <span class="senai-badge">SENAI</span>
                <span>Connect</span>
            </div>
            <div class="nav-links">
                <a href="feed.html">Feed</a>
                <a href="opportunities.html">Vagas e Mentoria</a>
                <a href="search.html">Explorar</a>
                <a href="inbox.html" class="active">Mensagens</a>
                <a href="profile.html">Meu Perfil</a>
                <a href="admin.html" id="adminNav" class="is-hidden">Moderacao</a>
                <button id="btnLogout" class="btn-logout">Sair</button>
            </div>
        </div>
    </nav>

    <main class="chat-container">
        <!-- Cabeçalho da Conversa -->
        <header class="chat-header">
            <img id="chatAvatar" class="avatar avatar-sm" src="" alt="Avatar">
            <div class="chat-participant-info">
                <strong id="chatName">Carregando...</strong>
                <span id="chatRoleBadge"></span>
            </div>
        </header>

        <!-- Mensagens Trocadas -->
        <section id="chatMessages" class="chat-messages" aria-live="polite">
            <p class="state-message">Carregando mensagens...</p>
        </section>

        <!-- Campo de Envio -->
        <form id="chatForm" class="chat-input-row">
            <input type="text" id="messageInput" placeholder="Escreva uma mensagem..." autocomplete="off" required>
            <button type="submit" id="btnSendMessage" class="btn-primary">Enviar</button>
        </form>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/chat.js"></script>
</body>
</html>
