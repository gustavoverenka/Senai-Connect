<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        .chat-container {
            max-width: 600px;
            margin: 2rem auto;
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 70vh;
        }
        .chat-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message-bubble {
            max-width: 75%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            font-size: 0.95rem;
        }
        .message-mine {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message-theirs {
            background: #f1f5f9;
            color: #334155;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .chat-input {
            padding: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">SENAI Connect</div>
            <div class="nav-links">
                <a href="feed.html">Feed</a>
                <a href="profile.html">Perfil</a>
                <a href="search.html">Buscar</a>
                <a href="inbox.html">Mensagens</a>
                <button onclick="logout()">Sair</button>
            </div>
        </div>
    </nav>

    <main class="chat-container">
        <div class="chat-header">
            <img id="chatAvatar" src="" class="avatar" alt="Avatar" style="width:40px;height:40px;border-radius:50%;">
            <strong id="chatName">Carregando...</strong>
        </div>
        <div class="chat-messages" id="chatMessages">
            <p style="text-align:center; color:var(--text-light); margin:auto;">Carregando mensagens...</p>
        </div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Escreva uma mensagem...">
            <button class="btn-primary" style="width:auto;" onclick="sendMessage()">Enviar</button>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/chat.js"></script>
</body>
</html>
