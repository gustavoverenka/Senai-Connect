<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — SENAI Connect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <h1> Redefinir senha</h1>
      <p>Crie uma nova senha para sua conta.</p>
    </div>

    <div id="alert-box"></div>

    <form id="reset-form">
      <div class="form-group">
        <label for="newPassword">Nova senha</label>
        <input type="password" id="newPassword" required minlength="6" placeholder="Mínimo 6 caracteres">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar nova senha</label>
        <input type="password" id="confirmPassword" required minlength="6" placeholder="Repita a nova senha">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Redefinir senha</button>
    </form>

    <div class="auth-footer">
      <a href="login.html">Voltar para o login</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/reset-password.js"></script>
</body>
</html>
