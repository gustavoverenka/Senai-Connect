<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Feed Institucional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/feed.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">
                <span class="senai-badge">SENAI</span>
                <span>Connect</span>
            </div>
            <div class="nav-links">
                <a href="feed.html" class="active">📰 Feed</a>
                <a href="opportunities.html">💼 Vagas & Mentoria</a>
                <a href="search.html">🔍 Explorar</a>
                <a href="inbox.html">💬 Mensagens</a>
                <a href="profile.html">👤 Meu Perfil</a>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>
        </div>
    </nav>

    <main class="feed-container">
        <!-- Criar Publicação -->
        <div class="create-post">
            <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:0.75rem;">
                <img id="myAvatar" class="avatar" src="" alt="Meu Avatar">
                <div>
                    <strong id="myName" style="font-size:0.95rem;">...</strong>
                    <div id="myBadge" style="margin-top:2px;"></div>
                </div>
            </div>
            <textarea id="postContent" rows="3" placeholder="Compartilhe projetos, conquistas ou novidades com a comunidade SENAI..."></textarea>
            
            <div class="create-post-actions" style="display:flex; justify-content:space-between; align-items:center; margin-top:12px; flex-wrap:wrap; gap:10px;">
                <div style="display:flex; align-items:center; gap:15px;">
                    <label style="cursor:pointer; display:flex; align-items:center; gap:5px; font-size:0.9rem; color:var(--text-light);">
                        📷 Imagem
                        <input type="file" id="postImage" accept="image/png,image/jpeg,image/webp" style="display:none;" onchange="updateImageLabel(this)">
                    </label>
                    <span id="imageFileName" style="font-size:0.8rem; color:var(--senai-blue-light);"></span>

                    <!-- Checkbox de Comunicado (Apenas para Professor e Admin) -->
                    <div id="announcementOption" style="display:none; align-items:center; gap:5px;">
                        <input type="checkbox" id="isAnnouncement" style="width:auto; cursor:pointer;">
                        <label for="isAnnouncement" style="margin-bottom:0; cursor:pointer; font-size:0.85rem; font-weight:600; color:#fbbf24;">📌 Fixar como Comunicado Oficial</label>
                    </div>
                </div>

                <button class="btn-primary" style="width:auto; margin-top:0; padding: 0.6rem 1.4rem;" onclick="createPost()">Publicar</button>
            </div>
        </div>
        
        <!-- Lista de Publicações -->
        <div id="feedList">
            <p style="text-align:center; color: var(--text-light); margin-top: 2rem;">Carregando publicações...</p>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/feed.js"></script>
</body>
</html>
