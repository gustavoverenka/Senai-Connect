<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed — SENAI Connect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page-wrap feed-page">
    <div class="feed-column">
      <div class="card post-composer">
        <h3 class="mt-0">Compartilhe algo</h3>
        <div id="composer-alert"></div>
        <form id="composer-form">
          <div class="form-group">
            <textarea id="post-content" maxlength="1000" placeholder="O que você quer compartilhar com a comunidade?" required></textarea>
          </div>
          <div id="announcement-row" class="checkbox-row form-group hidden">
            <input type="checkbox" id="post-announcement">
            <label for="post-announcement" class="mb-0">Fixar como aviso/comunicado</label>
          </div>
          <div class="composer-preview hidden" id="composer-preview">
            <img id="composer-preview-img" src="" alt="Pré-visualização">
          </div>
          <div class="composer-footer">
            <label class="file-label">
              Adicionar imagem
              <input type="file" id="post-image" accept="image/png, image/jpeg, image/webp" class="hidden">
            </label>
            <button type="submit" class="btn btn-primary" id="composer-submit">Publicar</button>
          </div>
        </form>
      </div>

      <div id="feed-container">
        <div class="spinner"></div>
      </div>
    </div>
  </main>

  <!-- Modal de denúncia -->
  <div id="report-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;">
    <div class="card" style="max-width:420px;width:90%;">
      <h3 class="mt-0">Denunciar publicação</h3>
      <div id="report-alert"></div>
      <form id="report-form">
        <div class="form-group">
          <label for="report-reason">Motivo</label>
          <select id="report-reason" required>
            <option value="spam">Spam</option>
            <option value="ofensivo">Conteúdo ofensivo</option>
            <option value="conteudo_improprio">Conteúdo impróprio</option>
            <option value="desinformacao">Desinformação</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="form-group">
          <label for="report-details">Detalhes (opcional)</label>
          <textarea id="report-details" maxlength="300" placeholder="Explique o motivo da denúncia"></textarea>
        </div>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-secondary btn-block" id="report-cancel">Cancelar</button>
          <button type="submit" class="btn btn-danger btn-block">Enviar denúncia</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/feed.js"></script>
</body>
</html>
