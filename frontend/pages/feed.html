<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Feed de Publicações</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/feed.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">
                <span class="senai-badge">SENAI</span>
                <span>Connect</span>
            </div>
            <div class="nav-links">
                <a href="feed.html" class="active">Feed</a>
                <a href="opportunities.html">Vagas & Mentoria</a>
                <a href="search.html">Explorar</a>
                <a href="inbox.html">Mensagens</a>
                <a href="profile.html">Meu Perfil</a>
                <a href="admin.html" id="adminNav" class="is-hidden"> Moderação</a>
                <button id="btnLogout" class="btn-logout">Sair</button>
            </div>
        </div>
    </nav>

    <main class="feed-container">
        <!-- Caixa de Criação de Post -->
        <section class="card create-post-card">
            <header class="create-post-header">
                <img id="myAvatar" class="avatar avatar-md" src="" alt="Meu Avatar">
                <div class="author-info">
                    <strong id="myName" class="author-name">Carregando...</strong>
                    <div id="myBadge"></div>
                </div>
            </header>

            <textarea id="postContent" class="textarea-post" rows="3" placeholder="Compartilhe projetos, novidades ou conquistas com a comunidade SENAI..."></textarea>
            
            <footer class="create-post-actions">
                <div class="post-attachments">
                    <label class="btn-upload" for="postImage">
                        📷 Imagem
                        <input type="file" id="postImage" accept="image/png,image/jpeg,image/webp" class="file-input-hidden">
                    </label>
                    <span id="imageFileName" class="file-name-indicator"></span>

                    <div id="announcementOption" class="announcement-toggle is-hidden">
                        <input type="checkbox" id="isAnnouncement">
                        <label for="isAnnouncement"> Fixar Comunicado Oficial</label>
                    </div>
                </div>

                <button id="btnPublish" class="btn-primary">Publicar</button>
            </footer>
        </section>
        
        <!-- Lista de Posts do Feed -->
        <section id="feedList" class="feed-list" aria-live="polite">
            <p class="state-message">Carregando publicações...</p>
        </section>
    </main>

    <!-- Modal de Denúncia -->
    <div id="reportModal" class="modal-overlay is-hidden" role="dialog" aria-labelledby="reportModalTitle" aria-modal="true">
        <div class="modal-content">
            <header class="modal-header">
                <h3 id="reportModalTitle"> Denunciar Publicação</h3>
                <button id="btnCloseReportModal" class="btn-close" aria-label="Fechar modal">&times;</button>
            </header>

            <form id="reportForm">
                <input type="hidden" id="reportPostId">
                <div class="form-group">
                    <label for="reportReason">Motivo da Denúncia</label>
                    <select id="reportReason" required>
                        <option value="spam"> Spam ou propaganda não autorizada</option>
                        <option value="ofensivo"> Linguagem ofensiva ou assédio</option>
                        <option value="conteudo_improprio"> Conteúdo impróprio / violação de diretrizes</option>
                        <option value="desinformacao"> Desinformação ou conteúdo enganoso</option>
                        <option value="outro"> Outro motivo</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="reportDetails">Detalhes adicionais (opcional)</label>
                    <textarea id="reportDetails" rows="3" maxlength="300" placeholder="Forneça detalhes adicionais para a equipe de moderação..."></textarea>
                </div>

                <footer class="modal-actions">
                    <button type="button" id="btnCancelReport" class="btn-secondary">Cancelar</button>
                    <button type="submit" class="btn-danger">Enviar Denúncia</button>
                </footer>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/feed.js"></script>
</body>
</html>
