<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/feed.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">SENAI Connect</div>
            <div class="nav-links">
                <a href="feed.html">Feed</a>
                <a href="profile.html">Perfil</a>
                <a href="search.html">Buscar</a>
                <a href="inbox.html">Mensagens</a>
                <button onclick="logout()">Sair da Conta</button>
            </div>
        </div>
    </nav>

    <main class="feed-container">
        <div class="create-post">
            <textarea id="postContent" rows="3" placeholder="O que você está pensando ou desenvolvendo hoje?"></textarea>
            <div class="create-post-actions" style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                <input type="file" id="postImage" accept="image/png,image/jpeg,image/webp">
                <button class="btn-primary" style="width:auto; margin-top:0; padding: 0.6rem 1.5rem;" onclick="createPost()">Publicar</button>
            </div>
        </div>
        
        <div id="feedList">
            <!-- Os posts serão renderizados via JavaScript aqui -->
            <p style="text-align:center; color: var(--text-light);">Carregando publicações...</p>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/feed.js"></script>
</body>
</html>
