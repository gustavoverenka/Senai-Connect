<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta — SENAI Connect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card" style="max-width: 560px;">
    <div class="auth-brand">
      <h1>🎓 SENAI Connect</h1>
      <p>Crie sua conta e conecte-se à comunidade SENAI</p>
    </div>

    <div id="alert-box"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="name">Nome completo</label>
        <input type="text" id="name" required placeholder="Seu nome completo">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" required placeholder="usuario_123">
          <div class="form-hint">Apenas letras, números e underline.</div>
        </div>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" required placeholder="seu@email.com">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="form-group">
          <label for="unit">Unidade SENAI</label>
          <input type="text" id="unit" placeholder="Ex: SENAI Blumenau">
        </div>
      </div>

      <label>Eu sou</label>
      <div class="role-tabs" id="role-tabs">
        <div class="role-tab active" data-role="aluno">Aluno</div>
        <div class="role-tab" data-role="ex-aluno">Ex-aluno</div>
        <div class="role-tab" data-role="professor">Professor</div>
      </div>

      <!-- Campos de Aluno -->
      <div class="role-fields active" id="fields-aluno">
        <div class="form-row">
          <div class="form-group">
            <label for="course">Curso</label>
            <input type="text" id="course" placeholder="Ex: Desenvolvimento de Sistemas">
          </div>
          <div class="form-group">
            <label for="class_period">Período/Turma</label>
            <input type="text" id="class_period" placeholder="Ex: Noturno - 3° módulo">
          </div>
        </div>
        <div class="form-group">
          <label for="registration_number">Matrícula</label>
          <input type="text" id="registration_number" placeholder="Número de matrícula">
        </div>
      </div>

      <!-- Campos de Ex-aluno -->
      <div class="role-fields" id="fields-ex-aluno">
        <div class="form-row">
          <div class="form-group">
            <label for="graduated_course">Curso concluído</label>
            <input type="text" id="graduated_course" placeholder="Ex: Mecatrônica Industrial">
          </div>
          <div class="form-group">
            <label for="graduation_year">Ano de formatura</label>
            <input type="number" id="graduation_year" placeholder="Ex: 2022">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="current_company">Empresa atual</label>
            <input type="text" id="current_company" placeholder="Onde você trabalha hoje">
          </div>
          <div class="form-group">
            <label for="current_position">Cargo atual</label>
            <input type="text" id="current_position" placeholder="Seu cargo">
          </div>
        </div>
        <div class="form-group">
          <label for="linkedin_url">LinkedIn</label>
          <input type="url" id="linkedin_url" placeholder="https://linkedin.com/in/seu-perfil">
        </div>
        <div class="checkbox-row form-group">
          <input type="checkbox" id="open_for_mentoring">
          <label for="open_for_mentoring" class="mb-0">Tenho disponibilidade para mentoria</label>
        </div>
      </div>

      <!-- Campos de Professor -->
      <div class="role-fields" id="fields-professor">
        <div class="form-group">
          <label for="teaching_areas">Áreas de ensino</label>
          <input type="text" id="teaching_areas" placeholder="Separe por vírgula. Ex: Redes, Programação">
        </div>
        <div class="form-group">
          <label for="teacher_code">Código institucional</label>
          <input type="text" id="teacher_code" placeholder="Código fornecido pela instituição">
          <div class="form-hint">Necessário para validar o cadastro de professores.</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn" style="margin-top: 8px;">Criar conta</button>
    </form>

    <div class="auth-footer">
      Já tem conta? <a href="login.html">Fazer login</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
