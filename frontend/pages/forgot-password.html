<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar senha — SENAI Connect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <h1> Recuperar senha</h1>
      <p>Informe seu e-mail para receber o link de redefinição de senha.</p>
    </div>

    <div id="alert-box"></div>

    <form id="forgot-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="seu@email.com">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Enviar link de recuperação</button>
    </form>

    <div class="auth-footer">
      <a href="login.html">Voltar para o login</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/forgot-password.js"></script>
</body>
</html>
