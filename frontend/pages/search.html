<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscar pessoas — SENAI Connect</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div id="navbar-root"></div>

  <main class="page-wrap">
    <div class="card">
      <h2 class="mt-0">Buscar pessoas</h2>
      <div class="filters-bar">
        <input type="search" id="search-q" placeholder="Buscar por nome ou usuário...">
        <select id="filter-role">
          <option value="">Todos os perfis</option>
          <option value="aluno">Alunos</option>
          <option value="ex-aluno">Ex-alunos</option>
          <option value="professor">Professores</option>
        </select>
        <select id="filter-mentoring">
          <option value="">Mentoria (todos)</option>
          <option value="true">Disponível para mentoria</option>
        </select>
        <input type="text" id="filter-course" placeholder="Curso">
        <input type="text" id="filter-unit" placeholder="Unidade">
      </div>
      <button class="btn btn-primary" id="search-btn">Buscar</button>
    </div>

    <div id="results" class="card">
      <p class="empty-state">Use os filtros acima para encontrar pessoas.</p>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/search.js"></script>
</body>
</html>
