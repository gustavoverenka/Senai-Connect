<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Explorar Comunidade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/search.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">
                <span class="senai-badge">SENAI</span>
                <span>Connect</span>
            </div>
            <div class="nav-links">
                <a href="feed.html"> Feed</a>
                <a href="opportunities.html"> Vagas & Mentoria</a>
                <a href="search.html" class="active"> Explorar</a>
                <a href="inbox.html"> Mensagens</a>
                <a href="profile.html"> Meu Perfil</a>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>
        </div>
    </nav>

    <main class="search-container">
        <div style="margin-bottom: 1.5rem;">
            <h2>Explorar a Comunidade SENAI</h2>
            <p style="color:var(--text-light); font-size:0.9rem;">Encontre colegas de curso, mentores formados e instrutores</p>
        </div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por nome, @usuário ou curso...">
            <button id="searchBtn" class="btn-primary">Buscar</button>
        </div>

        <!-- Filtros Rápidos por Role -->
        <div style="display:flex; gap:0.5rem; margin-bottom:1.5rem; flex-wrap:wrap;">
            <button class="filter-pill active" onclick="applyRoleFilter('', this)">Todos</button>
            <button class="filter-pill" onclick="applyRoleFilter('aluno', this)">🎓 Alunos</button>
            <button class="filter-pill" onclick="applyRoleFilter('ex-aluno', this)"> Ex-Alunos</button>
            <button class="filter-pill" onclick="applyRoleFilter('professor', this)">👨 Professores</button>
            <button class="filter-pill" onclick="applyMentoringFilter(this)"> Disponíveis para Mentoria</button>
        </div>

        <div id="userResults">
            <p style="text-align:center; color:var(--text-light);">Carregando comunidade...</p>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
