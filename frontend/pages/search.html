<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Explorar Comunidade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/search.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">
                <span class="senai-badge">SENAI</span>
                <span>Connect</span>
            </div>
            <div class="nav-links">
                <a href="feed.html">Feed</a>
                <a href="opportunities.html">Vagas e Mentoria</a>
                <a href="search.html" class="active">Explorar</a>
                <a href="inbox.html">Mensagens</a>
                <a href="profile.html">Meu Perfil</a>
                <a href="admin.html" id="adminNav" class="is-hidden">Moderacao</a>
                <button id="btnLogout" class="btn-logout">Sair</button>
            </div>
        </div>
    </nav>

    <main class="search-container">
        <header class="section-header">
            <h2>Explorar a Comunidade SENAI</h2>
            <p class="section-subtitle">Encontre colegas de curso, mentores formados e instrutores</p>
        </header>

        <!-- Campo de Busca -->
        <section class="search-box">
            <input type="search" id="searchInput" placeholder="Buscar por nome, usuario ou curso...">
            <button id="searchBtn" class="btn-primary">Buscar</button>
        </section>

        <!-- Filtros Rápidos por Categoria -->
        <nav class="filter-pills" aria-label="Filtros de membros">
            <button class="filter-pill active" data-role="">Todos</button>
            <button class="filter-pill" data-role="aluno">Alunos</button>
            <button class="filter-pill" data-role="ex-aluno">Ex-Alunos</button>
            <button class="filter-pill" data-role="professor">Professores</button>
            <button class="filter-pill" id="btnFilterMentoring">Disponiveis para Mentoria</button>
        </nav>

        <!-- Resultados da Busca -->
        <section id="userResults" class="user-results-grid" aria-live="polite">
            <p class="state-message">Carregando membros da comunidade...</p>
        </section>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/search.js"></script>
</body>
</html>
