<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI Connect - Conectando a Comunidade Acadêmica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <main class="auth-card">
            <header class="auth-header">
                <div class="auth-logo">
                    <span class="senai-badge">SENAI</span>
                    <span>Connect</span>
                </div>
                <h1 class="auth-title">Acesse sua Conta</h1>
                <p class="auth-subtitle">A rede profissional e acadêmica do ecossistema SENAI</p>
            </header>

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email">E-mail Institucional</label>
                    <input type="email" id="email" placeholder="seu.email@senai.br" required autocomplete="email">
                </div>

                <div class="form-group">
                    <div class="form-group-header">
                        <label for="password">Senha</label>
                    </div>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <button type="submit" id="btnLogin" class="btn-primary btn-block">Entrar no SENAI Connect</button>
            </form>

            <footer class="auth-links">
                <p>Ainda não possui uma conta? <a href="pages/register.html">Cadastre-se agora</a></p>
            </footer>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
